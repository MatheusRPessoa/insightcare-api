
services:
  postgres:
    image: postgres:16-alpine
    container_name: insightcare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: insightcare
      POSTGRES_USER: insightcare
      POSTGRES_PASSWORD: insightcare_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insightcare -d insightcare"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
